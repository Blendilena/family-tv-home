plugins {
    id 'com.android.application'
}

def vc = Integer.parseInt((project.findProperty('versionCode') ?: '1').toString())
def ks = System.getenv('FTV_KEYSTORE')

android {
    namespace 'com.familytv.home'
    compileSdk 34

    defaultConfig {
        applicationId 'com.familytv.home'
        minSdk 22
        targetSdk 34
        versionCode vc
        versionName "1.0.${vc}"
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('FTV_STORE_PASSWORD')
                keyAlias System.getenv('FTV_KEY_ALIAS')
                keyPassword System.getenv('FTV_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // CI signs with the repo's secret key so updates install over the old version.
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
