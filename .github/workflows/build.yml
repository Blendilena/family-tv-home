name: Build Family TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Repository secret KEYSTORE_B64 is missing (see README, 'Signing key')."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          FTV_KEYSTORE: ${{ runner.temp }}/release.jks
          FTV_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          FTV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FTV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "family-tv-home-1.0.${{ github.run_number }}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Family TV 1.0.${{ github.run_number }}
          body: Built automatically from ${{ github.sha }}. Install with `firetv.ps1 homeapp`.
          files: family-tv-home-1.0.${{ github.run_number }}.apk
          make_latest: true
